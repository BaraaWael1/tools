<!-- ضيف السطر ده جوه الـ <head> عشان أداة الـ PDF تشتغل -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

<!-- ... (جزء الهيدر كما هو) ... -->

<div class="tools-grid">
    
    <!-- أداة 1: مولد كلمات المرور -->
    <div class="tool-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-key"></i>
        </div>
        <h3>مولد كلمات المرور</h3>
        <p>أنشئ كلمات مرور قوية ومعقدة بضغطة زر.</p>
        
        <!-- مربع لعرض كلمة المرور -->
        <input type="text" id="passwordOutput" placeholder="كلمة المرور ستظهر هنا" readonly style="width: 100%; padding: 10px; margin-bottom: 15px; text-align: center; border: 1px solid #e5e7eb; border-radius: 8px; font-size: 1.1rem; background-color: #f9fafb;">
        
        <button class="btn" onclick="generatePassword()">توليد كلمة مرور</button>
    </div>

    <!-- أداة 2: تحويل PDF إلى صورة -->
    <div class="tool-card">
        <div class="icon-wrapper">
            <i class="fa-solid fa-file-pdf"></i>
        </div>
        <h3>PDF إلى صورة</h3>
        <p>اختر ملف PDF لتحويل أول صفحة فيه إلى صورة.</p>
        
        <!-- زر رفع الملف -->
        <input type="file" id="pdfInput" accept="application/pdf" style="margin-bottom: 15px; width: 100%;">
        
        <button class="btn" onclick="convertPdfToImage()">تحويل إلى صورة</button>
        
        <!-- مساحة لعرض الصورة الناتجة -->
        <canvas id="pdfCanvas" style="max-width: 100%; margin-top: 15px; display: none; border: 1px solid #e5e7eb; border-radius: 8px;"></canvas>
    </div>

</div>
