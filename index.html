<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baraa Tools</title>

  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body class="bg-zinc-50">

<nav class="w-full border-b bg-white">
    <div class="max-w-7xl mx-auto px-8 h-20 flex items-center justify-between">

        <h1 class="text-3xl font-bold">
            🛠️ Baraa Tools
        </h1>

        <button class="bg-black text-white px-6 py-3 rounded-full hover:bg-zinc-800 transition">
            Login
        </button>

    </div>
</nav>

<section class="max-w-7xl mx-auto text-center py-24 px-8">

    <h2 class="text-6xl font-bold">
        Free Online Tools
    </h2>

    <p class="text-zinc-500 text-xl mt-6">
        Beautiful, fast and simple tools for everyone.
    </p>

    <input
        class="mt-10 w-full max-w-xl border rounded-full px-6 py-4 text-lg"
        placeholder="Search tools...">

</section>

<section class="max-w-7xl mx-auto px-8 pb-20">

<div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8">

<div class="bg-white rounded-3xl p-8 shadow hover:shadow-xl transition">
<h3 class="text-2xl font-bold">🔐 Password Generator</h3>
<p class="text-zinc-500 mt-3">Create strong passwords instantly.</p>
</div>

<div class="bg-white rounded-3xl p-8 shadow hover:shadow-xl transition">
<h3 class="text-2xl font-bold">📅 Age Calculator</h3>
<p class="text-zinc-500 mt-3">Calculate your exact age.</p>
</div>

<div class="bg-white rounded-3xl p-8 shadow hover:shadow-xl transition">
<h3 class="text-2xl font-bold">📱 QR Generator</h3>
<p class="text-zinc-500 mt-3">Generate QR codes.</p>
</div>

</div>

</section>

</body>
</html>
