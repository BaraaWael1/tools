<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ادوات مفيدة جداً</title>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.0/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f4f8;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --primary-color: #3498db;
            --primary-hover: #2980b9;
            --action-color: #2ecc71;
            --action-hover: #27ae60;
            --shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 15px 30px rgba(0, 0, 0, 0.15);
            --transition: all 0.3s ease-in-out;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            transition: var(--transition);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--primary-color);
            text-align: center;
            flex-grow: 1;
        }

        .lang-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.3);
            transition: var(--transition);
        }

        .lang-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .card h2 {
            margin-top: 0;
            font-size: 1.4rem;
            color: var(--text-main);
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button.action-btn {
            background: var(--action-color);
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            transition: var(--transition);
        }

        button.action-btn:hover {
            background: var(--action-hover);
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            min-height: 24px;
            font-weight: bold;
            color: var(--primary-color);
            word-wrap: break-word;
        }

        .barcode-container {
            margin-top: 15px;
            background: white;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        
        svg {
            max-width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <button id="langToggle" class="lang-btn" onclick="toggleLanguage()">English</button>
        <h1 id="mainTitle">ادوات مفيدة جداً</h1>
        <div style="width: 80px;"></div> <!-- Spacer for center alignment -->
    </header>

    <div class="tools-grid">
        <!-- Tool 1: Barcode Generator -->
        <div class="card">
            <h2 id="title1">📊 مولد باركود</h2>
            <input type="text" id="barcodeInput" placeholder="أدخل النص أو الرقم هنا...">
            <button class="action-btn" id="btn1" onclick="generateBarcode()">توليد الباركود</button>
            <div class="barcode-container" id="barcodeWrapper">
                <svg id="barcode"></svg>
            </div>
        </div>

        <!-- Tool 2: Password Generator -->
        <div class="card">
            <h2 id="title2">🔐 مولد كلمات المرور</h2>
            <input type="number" id="passLength" placeholder="طول كلمة المرور (مثال: 12)" min="4" max="32">
            <button class="action-btn" id="btn2" onclick="generatePassword()">توليد كلمة مرور</button>
            <div class="result-box" id="passResult">...</div>
        </div>

        <!-- Tool 3: Word Counter -->
        <div class="card">
            <h2 id="title3">📝 عداد الكلمات</h2>
            <textarea id="textInput" rows="4" placeholder="اكتب أو انسخ النص هنا..."></textarea>
            <button class="action-btn" id="btn3" onclick="countWords()">احسب الكلمات</button>
            <div class="result-box" id="wordResult">الكلمات: 0 | الحروف: 0</div>
        </div>

        <!-- Tool 4: Age Calculator -->
        <div class="card">
            <h2 id="title4">⏳ حاسبة العمر</h2>
            <input type="date" id="dobInput">
            <button class="action-btn" id="btn4" onclick="calculateAge()">احسب عمري</button>
            <div class="result-box" id="ageResult">...</div>
        </div>

        <!-- Tool 5: BMI Calculator -->
        <div class="card">
            <h2 id="title5">⚖️ حاسبة كتلة الجسم</h2>
            <input type="number" id="weightInput" placeholder="الوزن بالكيلوجرام (مثال: 70)">
            <input type="number" id="heightInput" placeholder="الطول بالسنتيمتر (مثال: 175)">
            <button class="action-btn" id="btn5" onclick="calculateBMI()">احسب الكتلة</button>
            <div class="result-box" id="bmiResult">...</div>
        </div>
    </div>
</div>

<script>
    // --- Translations Dictionary ---
    const translations = {
        ar: {
            mainTitle: "ادوات الحج وائل وابنه الاكبر بيبو",
            langToggle: "English",
            title1: "📊 مولد باركود",
            title2: "🔐 مولد كلمات المرور",
            title3: "📝 عداد الكلمات",
            title4: "⏳ حاسبة العمر",
            title5: "⚖️ حاسبة كتلة الجسم",
            btn1: "توليد الباركود",
            btn2: "توليد كلمة مرور",
            btn3: "احسب الكلمات",
            btn4: "احسب عمري",
            btn5: "احسب الكتلة",
            barcodeInput: "أدخل النص أو الرقم هنا...",
            passLength: "طول كلمة المرور (مثال: 12)",
            textInput: "اكتب أو انسخ النص هنا...",
            weightInput: "الوزن بالكيلوجرام (مثال: 70)",
            heightInput: "الطول بالسنتيمتر (مثال: 175)",
            wordRes: "الكلمات: {w} | الحروف: {c}",
            ageRes: "{y} سنة، {m} شهر، {d} يوم",
            bmiRes: "مؤشر الكتلة: {bmi} ({status})",
            bmiStatuses: ["نقص في الوزن", "وزن طبيعي", "وزن زائد", "سمنة"],
            selectDateError: "الرجاء تحديد تاريخ الميلاد"
        },
        en: {
            mainTitle: "Haj Wael & His Eldest Son Bibo's Tools",
            langToggle: "العربية",
            title1: "📊 Barcode Generator",
            title2: "🔐 Password Generator",
            title3: "📝 Word Counter",
            title4: "⏳ Age Calculator",
            title5: "⚖️ BMI Calculator",
            btn1: "Generate Barcode",
            btn2: "Generate Password",
            btn3: "Count Words",
            btn4: "Calculate Age",
            btn5: "Calculate BMI",
            barcodeInput: "Enter text or number here...",
            passLength: "Password length (e.g. 12)",
            textInput: "Type or paste text here...",
            weightInput: "Weight in KG (e.g. 70)",
            heightInput: "Height in CM (e.g. 175)",
            wordRes: "Words: {w} | Characters: {c}",
            ageRes: "{y} Years, {m} Months, {d} Days",
            bmiRes: "BMI: {bmi} ({status})",
            bmiStatuses: ["Underweight", "Normal weight", "Overweight", "Obesity"],
            selectDateError: "Please select a date of birth"
        }
    };

    let currentLang = 'ar';

    // --- Language Toggle Logic ---
    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        document.documentElement.lang = currentLang;
        document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
        
        const t = translations[currentLang];
        
        // Update Texts
        document.getElementById('mainTitle').innerText = t.mainTitle;
        document.getElementById('langToggle').innerText = t.langToggle;
        document.getElementById('title1').innerText = t.title1;
        document.getElementById('title2').innerText = t.title2;
        document.getElementById('title3').innerText = t.title3;
        document.getElementById('title4').innerText = t.title4;
        document.getElementById('title5').innerText = t.title5;
        document.getElementById('btn1').innerText = t.btn1;
        document.getElementById('btn2').innerText = t.btn2;
        document.getElementById('btn3').innerText = t.btn3;
        document.getElementById('btn4').innerText = t.btn4;
        document.getElementById('btn5').innerText = t.btn5;
        
        // Update Placeholders
        document.getElementById('barcodeInput').placeholder = t.barcodeInput;
        document.getElementById('passLength').placeholder = t.passLength;
        document.getElementById('textInput').placeholder = t.textInput;
        document.getElementById('weightInput').placeholder = t.weightInput;
        document.getElementById('heightInput').placeholder = t.heightInput;

        // Reset Results
        document.getElementById('passResult').innerText = "...";
        document.getElementById('ageResult').innerText = "...";
        document.getElementById('bmiResult').innerText = "...";
        document.getElementById('wordResult').innerText = t.wordRes.replace('{w}', 0).replace('{c}', 0);
    }

    // --- Tool 1: Barcode Generator ---
    function generateBarcode() {
        const text = document.getElementById('barcodeInput').value;
        const wrapper = document.getElementById('barcodeWrapper');
        if (text.trim() === "") return;
        
        wrapper.style.display = 'block';
        try {
            JsBarcode("#barcode", text, {
                format: "CODE128",
                lineColor: "#2c3e50",
                width: 2,
                height: 50,
                displayValue: true
            });
        } catch (e) {
            alert(currentLang === 'ar' ? "نص غير صالح للباركود" : "Invalid text for barcode");
        }
    }

    // --- Tool 2: Password Generator ---
    function generatePassword() {
        let length = document.getElementById('passLength').value;
        if (!length || length < 4) length = 12;
        const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()_+";
        let password = "";
        for (let i = 0; i < length; i++) {
            password += chars.charAt(Math.floor(Math.random() * chars.length));
        }
        document.getElementById('passResult').innerText = password;
    }

    // --- Tool 3: Word Counter ---
    function countWords() {
        const text = document.getElementById('textInput').value.trim();
        const words = text === "" ? 0 : text.split(/\s+/).length;
        const chars = text.length;
        const t = translations[currentLang];
        document.getElementById('wordResult').innerText = t.wordRes.replace('{w}', words).replace('{c}', chars);
    }

    // --- Tool 4: Age Calculator ---
    function calculateAge() {
        const dobInput = document.getElementById('dobInput').value;
        const t = translations[currentLang];
        
        if (!dobInput) {
            document.getElementById('ageResult').innerText = t.selectDateError;
            return;
        }

        const dob = new Date(dobInput);
        const today = new Date();
        
        let years = today.getFullYear() - dob.getFullYear();
        let months = today.getMonth() - dob.getMonth();
        let days = today.getDate() - dob.getDate();

        if (days < 0) {
            months--;
            days += new Date(today.getFullYear(), today.getMonth(), 0).getDate();
        }
        if (months < 0) {
            years--;
            months += 12;
        }

        document.getElementById('ageResult').innerText = t.ageRes.replace('{y}', years).replace('{m}', months).replace('{d}', days);
    }

    // --- Tool 5: BMI Calculator ---
    function calculateBMI() {
        const weight = parseFloat(document.getElementById('weightInput').value);
        const height = parseFloat(document.getElementById('heightInput').value) / 100;
        const t = translations[currentLang];

        if (!weight || !height) return;

        const bmi = (weight / (height * height)).toFixed(1);
        let statusIdx = 0;

        if (bmi < 18.5) statusIdx = 0;
        else if (bmi >= 18.5 && bmi < 24.9) statusIdx = 1;
        else if (bmi >= 25 && bmi < 29.9) statusIdx = 2;
        else statusIdx = 3;

        const status = t.bmiStatuses[statusIdx];
        document.getElementById('bmiResult').innerText = t.bmiRes.replace('{bmi}', bmi).replace('{status}', status);
    }
</script>

</body>
</html>
